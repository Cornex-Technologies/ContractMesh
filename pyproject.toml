[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeclaim"
version = "0.1.0"
description = "Transactional Semantic Memory & Contract Mesh for Collaborative Coding Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "jinja2==3.1.6",
    "psycopg[binary,pool]==3.3.4",
    "langchain-cockroachdb==0.3.0",
    "langchain-core==1.5.5",
    "langgraph==1.2.11",
    "boto3==1.43.72",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "mcp>=1.8,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[project.scripts]
codeclaim = "coordinator.cli:main"

[tool.setuptools.packages.find]
include = ["coordinator*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "repos/orders-service/tests"]
markers = [
    "integration: requires a CockroachDB instance (local or cloud)",
    "cloud: requires CockroachDB Cloud, AWS Bedrock, or MCP connection",
    "live: explicitly invokes the REST-backed live harness scenario",
]
